name: CI – Cloudfit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint PHP con Laravel Pint ─────────────────────────────────────
  lint:
    name: PHP Lint (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verificar estilo de código (Pint)
        run: ./vendor/bin/pint --test

  # ── Job 2: Tests PHP (PHPUnit) ────────────────────────────────────────────
  test:
    name: PHP Tests (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    env:
      # phpunit.xml ya configura DB_CONNECTION=sqlite y DB_DATABASE=:memory:
      # SUPABASE_URL se necesita aunque sea como placeholder (el middleware lo valida)
      SUPABASE_URL: https://placeholder.supabase.co
      # Si en el futuro se agregan tests de integración reales con Supabase,
      # agregar como GitHub Secret: Settings → Secrets → SUPABASE_JWT_SECRET
      # SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, openssl
          coverage: none

      - name: Instalar dependencias Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configurar entorno de testing
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Ejecutar migraciones (SQLite en memoria)
        run: php artisan migrate --force --ansi

      - name: Ejecutar tests
        run: php artisan test --ansi

  # ── Job 3: Build del frontend (Vite + React) ──────────────────────────────
  build-frontend:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: api-backend/package-lock.json

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar frontend
        run: npm run build
