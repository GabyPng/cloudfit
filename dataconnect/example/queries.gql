


# Obtener perfil del usuario autenticado
query GetMiPerfil @auth(level: USER) {
  perfilUsuarios(where: { usuarioId: { eq_expr: "auth.uid" } }) {
    foto
    descripcion
    usuario {
      nombre
      correo
      rol
    }
  }
}

# Obtener todos los coaches con su info
query GetAllCoaches @auth(level: USER) {
  coaches {
    especialidad
    aniosExperiencia
    coach {
      id
      nombre
    }
  }
}

# Obtener todos los nutriologos
query GetAllNutriologos @auth(level: USER) {
  nutriologos {
    enfoque
    cedulaProfesional
    nutriologo {
      id
      nombre
    }
  }
}

# Obtener clientes de un coach
query GetClientesByCoach($coachId: UUID!) @auth(level: USER) {
  clientes(where: { coachId: { eq: $coachId } }) {
    fechaNacimiento
    altura
    usuario {
      nombre
      correo
    }
  }
}

# Obtener clientes de un nutriologo
query GetClientesByNutriologo($nutriologoId: UUID!) @auth(level: USER) {
  clientes(where: { nutriologoId: { eq: $nutriologoId } }) {
    fechaNacimiento
    altura
    usuario {
      nombre
      correo
    }
  }
}

# Obtener historial de progreso de un cliente
query GetProgresoCliente($clienteId: UUID!) @auth(level: USER) {
  progresos(where: { clienteId: { eq: $clienteId } }, orderBy: { fecha: DESC }) {
    peso
    imc
    fecha
  }
}

# Obtener plan nutricional de un cliente
query GetPlanNutricional($clienteId: UUID!) @auth(level: USER) {
  planNutricionals(where: { clienteId: { eq: $clienteId } }) {
    descripcion
    fechaInicio
    fechaFin
  }
}

# Obtener todos los tickets (admin)
query GetAllTickets @auth(level: USER) {
  tickets(orderBy: { fechaCreacion: DESC }) {
    id
    asunto
    estado
    fechaCreacion
    usuario {
      nombre
      correo
    }
  }
}

# Obtener mensajes de un ticket
query GetMensajesTicket($ticketId: UUID!) @auth(level: USER) {
  mensajeTickets(where: { ticketId: { eq: $ticketId } }, orderBy: { fechaEnvio: ASC }) {
    contenido
    fechaEnvio
    remitente {
      nombre
    }
  }
}

# Obtener certificaciones de un usuario
query GetCertificaciones($usuarioId: String!) @auth(level: USER) {
  certificacions(where: { usuarioId: { eq: $usuarioId } }) {
    titulo
    fechaAprobacion
    administrador {
      usuario {
        nombre
      }
    }
  }
}


# -----------------------------------------------------------------

# Coach ve sus clientes (para elegir a quién asignar)
query GetMisClientes @auth(level: USER) {
  clientes(where: { coachId: { eq_expr: "auth.uid" } }) {
    usuarioId
    usuario {
      nombre
    }
    fechaNacimiento
    altura
  }
}

# Ver rutinas asignadas a un cliente específico
query GetRutinasByCliente($clienteId: UUID!) @auth(level: USER) {
  rutinas(where: { clienteId: { eq: $clienteId } }) {
    id
    nombre
    descripcion
    fechaInicio
    fechaFin
    ejercicios: rutinaEjercicios_on_rutina(orderBy: { orden: ASC }) {
      series
      repeticiones
      descansoSegundos
      orden
      ejercicio {
        nombre
        grupoMuscular
      }
    }
  }
}

# Catálogo de ejercicios disponibles
query GetEjercicios @auth(level: USER) {
  ejercicios {
    id
    nombre
    descripcion
    grupoMuscular
  }
}



