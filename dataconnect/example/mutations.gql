

mutation CreateUsuario($nombre: String!, $correo: String!, $contrasena: String!, $rol: Role!)
@auth(level: PUBLIC) {
  usuario_insert(data: {
    nombre: $nombre,
    correo: $correo,
    contrasena: $contrasena,
    rol: $rol
  })
}

# Crear perfil de usuario
mutation CrearPerfil($foto: String, $descripcion: String) @auth(level: USER) {
  perfilUsuario_insert(data: { usuarioId_expr: "auth.uid", foto: $foto, descripcion: $descripcion })
}

# Registrar como Coach
mutation CrearCoach($especialidad: String!, $aniosExperiencia: Int!) @auth(level: USER) {
  coach_insert(data: { coachId_expr: "auth.uid", especialidad: $especialidad, aniosExperiencia: $aniosExperiencia })
}

# Registrar como Nutriologo
mutation CrearNutriologo($enfoque: String!, $cedulaProfesional: String!) @auth(level: USER) {
  nutriologo_insert(data: { nutriologoId_expr: "auth.uid", enfoque: $enfoque, cedulaProfesional: $cedulaProfesional })
}

# Registrar Cliente con coach y nutriologo asignados
mutation CrearCliente($coachId: UUID, $nutriologoId: UUID, $fechaNacimiento: Date, $altura: Float) @auth(level: USER) {
  cliente_insert(data: { usuarioId_expr: "auth.uid", coachId: $coachId, nutriologoId: $nutriologoId, fechaNacimiento: $fechaNacimiento, altura: $altura })
}

# Registrar progreso de un cliente
mutation RegistrarProgreso($clienteId: UUID!, $peso: Float!, $imc: Float!) @auth(level: USER) {
  progreso_insert(data: { clienteId: $clienteId, peso: $peso, imc: $imc })
}


# Coach crea un ejercicio en el catálogo
mutation CrearEjercicio(
  $nombre: String!
  $descripcion: String
  $grupoMuscular: String
) @auth(level: USER) {
  ejercicio_insert(data: {
    nombre: $nombre
    descripcion: $descripcion
    grupoMuscular: $grupoMuscular
    creadoPorId_expr: "auth.uid"
  })
}

# Coach crea una rutina y la asigna a un cliente
mutation CrearRutina(
  $clienteId: UUID!
  $nombre: String!
  $descripcion: String
  $fechaFin: Date
) @auth(level: USER) {
  rutina_insert(data: {
    coachId_expr: "auth.uid"
    clienteId: $clienteId
    nombre: $nombre
    descripcion: $descripcion
    fechaFin: $fechaFin
  })
}

# Coach agrega un ejercicio a una rutina existente
mutation AgregarEjercicioARutina(
  $rutinaId: UUID!
  $ejercicioId: UUID!
  $series: Int
  $repeticiones: Int
  $descansoSegundos: Int
  $orden: Int
) @auth(level: USER) {
  rutinaEjercicio_insert(data: {
    rutinaId: $rutinaId
    ejercicioId: $ejercicioId
    series: $series
    repeticiones: $repeticiones
    descansoSegundos: $descansoSegundos
    orden: $orden
  })
}


# Crear plan nutricional para un cliente
mutation CrearPlanNutricional($clienteId: UUID!, $descripcion: String!, $fechaFin: Date) @auth(level: USER) {
  planNutricional_insert(data: { clienteId: $clienteId, descripcion: $descripcion, fechaFin: $fechaFin })
}

# Crear ticket de soporte
mutation CrearTicket($asunto: String!) @auth(level: USER) {
  ticket_insert(data: { usuarioId_expr: "auth.uid", asunto: $asunto, estado: ABIERTO })
}

# Responder a un ticket
mutation ResponderTicket($ticketId: UUID!, $contenido: String!) @auth(level: USER) {
  mensajeTicket_insert(data: { ticketId: $ticketId, remitenteId_expr: "auth.uid", contenido: $contenido })
}

# Cambiar estado de un ticket (admin)
mutation CambiarEstadoTicket($id: UUID!, $estado: EstadoTicket!) @auth(level: USER) {
  ticket_update(id: $id, data: { estado: $estado })
}

# Emitir certificacion a un usuario (admin)
mutation EmitirCertificacion($usuarioId: String!, $titulo: String!) @auth(level: USER) {
  certificacion_insert(data: { administradorId_expr: "auth.uid", usuarioId: $usuarioId, titulo: $titulo })
}









